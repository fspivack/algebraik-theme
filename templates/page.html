{# page.html #}
{% extends "base.html" %}

{% block html_lang %}{{ page.lang }}{% endblock %}

{% block extratitle %}{{ page.title }}{% endblock extratitle %}

{% block content %}
<div class="hero"><div class="hero-content">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
        <h2>{{ page.subtitle }}</h2>
    {% endif %}
</div></div>
<div class="main-text">
    {{ page.content }}
</div></div>
{% endblock content %}
