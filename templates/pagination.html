{# pagination.html #}

{% if articles.paginator.num_pages > 1 %}
    <nav class="pagination">
        <ul>
            {% if articles.has_previous() %}
                <li class="prev">
                    <a href="{{ SITEURL }}/{{ articles.previous_page.url }}">
                        &larr; Newer Posts
                    </a>
                </li>
            {% endif %}

            {% if articles.has_next() %}
                <li class="next">
                    <a href="{{ SITEURL }}/{{ articles.next_page.url }}">
                        Older Posts &rarr;
                    </a>
                </li>
            {% endif %}
        </ul>
        <p>Page {{ articles.number }} of {{ articles.paginator.num_pages }}</p>
    </nav>
{% endif %}
